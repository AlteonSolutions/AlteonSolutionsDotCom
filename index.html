document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

             <div style=\"background:#fff;border-radius:6px;padding:10px;text-align:center;font-size:19px;font-weight:700;color:#1E2A33;box-shadow:0 1px 2px rgba(0,0,0,0.04)\">{{ appealLabel }}<\u002Fdiv>\n                <span style=\"text-align:center;font-size:12px;color:#5A6B77\">Select a gift type:<\u002Fspan>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr 1.3fr 0.8fr;gap:8px\">\n                  <sc-for list=\"{{ catBtns }}\" as=\"cb\" hint-placeholder-count=\"4\">\n                    <span style=\"border-radius:6px;padding:9px 4px;text-align:center;font-size:12px;font-weight:600;white-space:nowrap;transition:all 250ms;border:1.5px solid #557A8F;background:{{ cb.bg }};color:{{ cb.fg }}\">{{ cb.l }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #EEF0F2;padding:14px;display:flex;justify-content:center\"><img src=\"43f44a67-3fda-4465-8e28-91151ed14138\" alt=\"Powered by Alteon Apps\" style=\"height:30px;width:auto;display:block\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ navDots }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;justify-content:center;gap:8px\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ tb.go }}\" aria-label=\"{{ tb.label }}\" style=\"height:8px;border:0;padding:0;border-radius:4px;cursor:pointer;transition:width 300ms ease,background 300ms;width:{{ tb.dotW }};background:{{ tb.dotBg }}\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ navCaption }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;min-height:48px;padding-left:20px\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"4\">\n        <div style=\"position:absolute;left:20px;right:0;top:0;display:flex;flex-direction:column;gap:4px;transition:opacity 500ms ease;opacity:{{ tb.capOp }}\">\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:15px\">{{ tb.title }}<\u002Fspan>\n          <span style=\"font-size:14px;color:#5A626B\">{{ tb.desc }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ navList }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;padding-left:20px\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ tb.go }}\" style=\"display:flex;flex-direction:column;gap:4px;text-align:left;background:none;border:0;padding:12px 0 6px;cursor:pointer;position:relative;font-family:'IBM Plex Sans',sans-serif\">\n          <span style=\"position:absolute;left:0;right:0;top:0;height:1px;background:#DDE1E5;display:block\"><span style=\"display:block;height:2px;margin-top:-0.5px;background:#16191C;transform-origin:left;transition:transform 120ms linear;transform:{{ tb.prog }}\"><\u002Fspan><\u002Fspan>\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:15px;transition:color 300ms;color:{{ tb.color }}\">{{ tb.title }}<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;transition:color 300ms;color:{{ tb.descColor }}\">{{ tb.desc }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ navStack }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;font-family:'IBM Plex Mono',monospace;font-size:13px\">\n      <sc-for list=\"{{ capList }}\" as=\"cp\" hint-placeholder-count=\"1\">\n        <div style=\"grid-area:1 / 1;display:flex;align-items:baseline;justify-content:center;gap:14px;transition:opacity 400ms ease;opacity:{{ cp.o }}\"><span style=\"color:#0A6A9E\">{{ cp.n }}<\u002Fspan><span style=\"color:#16191C\">{{ cp.l }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ navNum }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding-left:20px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase\"><span style=\"color:#0A6A9E\">{{ counter }}<\u002Fspan><span style=\"color:#16191C\">{{ curLabel }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ prev }}\" aria-label=\"Previous\" style=\"width:36px;height:36px;border:1px solid #C9CED4;background:#fff;border-radius:4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#16191C\" style-hover=\"border-color:#16191C\">←<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ next }}\" aria-label=\"Next\" style=\"width:36px;height:36px;border:1px solid #C9CED4;background:#fff;border-radius:4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#16191C\" style-hover=\"border-color:#16191C\">→<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"upgrade\" data-screen-label=\"The upgrade\" style=\"border-top:1px solid #E1E4E8;background:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:32px;align-items:end\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#5A626B\">01 — The upgrade<\u002Fdiv>\n        <h2 style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.1;letter-spacing:-0.015em;margin:0;text-wrap:balance\">Keep the process. Lose the workarounds.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;line-height:1.6;color:#3A4148;margin:0;text-wrap:pretty\">Your team has already worked out how the job gets done. We preserve that logic and move it out of shared files and fragile flows into a single application that is monitored, secured, and always available.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #16191C\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid #E1E4E8;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#5A626B\"><span>Today<\u002Fspan><span><\u002Fspan><span style=\"color:#0A6A9E\">With Alteon<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ upgrades }}\" as=\"u\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:16px;padding:24px 0;border-bottom:1px solid #E1E4E8;align-items:center\">\n          <span style=\"font-size:17px;line-height:1.5;color:#5A626B;text-wrap:pretty\">{{ u.from }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#19B2FF;text-align:center\">→<\u002Fspan>\n          <span style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:18px;line-height:1.4;text-wrap:pretty\">{{ u.to }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" data-screen-label=\"Services\" style=\"border-top:1px solid #E1E4E8\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px;display:flex;flex-direction:column;gap:56px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:32px;align-items:end\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#5A626B\">02 — Services<\u002Fdiv>\n        <h2 style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.1;letter-spacing:-0.015em;margin:0;text-wrap:balance\">We start with what you already run.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;line-height:1.6;color:#3A4148;margin:0;text-wrap:pretty\">Most engagements begin with a workbook, a SharePoint list, or a set of flows that the business has outgrown. We stabilize what exists, then rebuild the critical parts as a hosted application.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #E1E4E8;border-radius:6px;padding:36px 32px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#0A6A9E\">Stabilize<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;background:#F0F2F4;color:#3A4148;padding:4px 8px;border-radius:3px;white-space:nowrap\">You are here<\u002Fspan><\u002Fdiv>\n        <h3 style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:22px;margin:0\">Excel, SharePoint &amp; automation<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#3A4148;margin:0\">The foundation of the practice. We build, repair, and support the Excel/VBA, Power Automate, SharePoint, and Power Apps tools your operations rely on today.<\u002Fp>\n        <ul style=\"margin:0;padding:18px 0 0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;color:#3A4148;border-top:1px solid #EEF0F2\">\n          <li>Excel/VBA workbooks and imports<\u002Fli>\n          <li>Power Automate and DocuSign flows<\u002Fli>\n          <li>SharePoint and Power Apps tools<\u002Fli>\n          <li>Auto-built PowerPoint reports<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E4E8;border-radius:6px;padding:36px 32px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#0A6A9E\">Rebuild<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;background:#E5F5FE;color:#0A5A86;padding:4px 8px;border-radius:3px;white-space:nowrap\">Where we take you<\u002Fspan><\u002Fdiv>\n        <h3 style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:22px;margin:0\">Hosted web apps &amp; SaaS<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#3A4148;margin:0\">Custom applications hosted under alteonapps.com, each on its own subdomain with its own login. Single-client or multi-tenant, depending on what the business needs.<\u002Fp>\n        <ul style=\"margin:0;padding:18px 0 0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;color:#3A4148;border-top:1px solid #EEF0F2\">\n          <li>Microsoft SSO and row-level security<\u002Fli>\n          <li>Tablet-optimized interfaces for the floor<\u002Fli>\n          <li>Alerts to Teams and email<\u002Fli>\n          <li>Hosted on Azure and maintained by Alteon<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E4E8;border-radius:6px;padding:36px 32px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#0A6A9E\">Extend<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;background:#EEF7EC;color:#2F6B3A;padding:4px 8px;border-radius:3px;white-space:nowrap\">What comes next<\u002Fspan><\u002Fdiv>\n        <h3 style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:22px;margin:0\">AI &amp; analytics<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#3A4148;margin:0\">AI assistants and analytics products that turn CRM and operational data into clear decisions, built on reliable revenue models and KPIs.<\u002Fp>\n        <ul style=\"margin:0;padding:18px 0 0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;color:#3A4148;border-top:1px solid #EEF0F2\">\n          <li>AI assistants with privacy-first data models<\u002Fli>\n          <li>Deduplication, retention and YoY KPIs<\u002Fli>\n          <li>Combined revenue models across systems<\u002Fli>\n          <li>Interactive dashboards<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection><\u002Fdiv>\n\n\n<section id=\"work\" data-screen-label=\"Work\" style=\"border-top:1px solid #E1E4E8;background:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#5A626B\">03 — Selected work<\u002Fdiv>\n      <h2 style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.1;letter-spacing:-0.015em;margin:0;text-wrap:balance\">Processes we've taken to the next level.<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#3A4148;margin:0;text-wrap:pretty\">A selection of recent engagements. Client names are withheld; each project is described by industry.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px\">\n      <sc-for list=\"{{ work }}\" as=\"w\" hint-placeholder-count=\"6\">\n        <article style=\"background:#fff;border:1px solid #E1E4E8;border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:14px\" style-hover=\"border-color:#19B2FF\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase\"><span style=\"color:#0A6A9E\">{{ w.industry }}<\u002Fspan><span style=\"color:#5A626B\">{{ w.type }}<\u002Fspan><\u002Fdiv>\n          <h3 style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:20px;line-height:1.3;margin:0;text-wrap:balance\">{{ w.title }}<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;color:#3A4148;margin:0;text-wrap:pretty\">{{ w.body }}<\u002Fp>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"delivery\" data-screen-label=\"How we deliver\" style=\"background:#16191C;color:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px;display:flex;flex-direction:column;gap:56px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#8FD8FF\">04 — How we deliver<\u002Fdiv>\n      <h2 style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.1;letter-spacing:-0.015em;margin:0;text-wrap:balance\">Your own app, at your own address.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:40px\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #3A4148;padding-top:20px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#19B2FF\">{{ s.n }}<\u002Fspan>\n          <h3 style=\"font-family:Montserrat,sans-serif;font-weight:600;font-size:19px;margin:0\">{{ s.title }}<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.6;color:#C3C9CF;margin:0\">{{ s.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" data-screen-label=\"About\" style=\"border-top:1px solid #E1E4E8;background:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:64px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#5A626B\">05 — About<\u002Fdiv>\n      <h2 style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.1;letter-spacing:-0.015em;margin:0;text-wrap:balance\">Industrial engineering, applied to software.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:20px;font-size:17px;line-height:1.65;color:#3A4148\">\n      <p style=\"margin:0;text-wrap:pretty\">Alteon Solutions is led by Duke Bonaventura, an industrial engineer based in Virginia's Shenandoah Valley. For years, our core work has been Excel/VBA, Power Automate, and SharePoint solutions for nonprofit and commercial clients.<\u002Fp>\n      <p style=\"margin:0;text-wrap:pretty\">We approach every project the way an engineer approaches a
